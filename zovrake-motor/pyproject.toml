[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zovrake-motor"
version = "9.4.0"
description = "Motor Inteligente de ZOVRAKE — servicio independiente del ERP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "ZOVRAKE" }]
dependencies = [
    "pypdf>=5.0,<7",
    "pdfplumber>=0.11,<1",
    "Pillow>=10,<13",
    "pytesseract>=0.3.13,<1",
    "pypdfium2>=4.30,<5",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=8.0", "fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27"]

[project.scripts]
zovrake-motor = "main:main"
zovrake-motor-api = "zovrake_motor.api.http.server:main"
zovrake-motor-certify = "certify:main"
zovrake-motor-certify-comprehension = "certify_comprehension:main"
zovrake-motor-certify-classification = "certify_classification:main"
zovrake-motor-certify-classification-closure = "certify_classification_closure:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zovrake_motor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
